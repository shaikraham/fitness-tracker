<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🏋️‍♀️ Fitness Tracker</h1>

    <form id="fitnessForm">
      <input type="number" id="steps" placeholder="Steps Walked" required>
      <input type="number" id="calories" placeholder="Calories Burned" required>
      <input type="text" id="workout" placeholder="Workout Type (e.g. Yoga, Running)" required>
      <button type="submit">Add Activity</button>
    </form>

    <div class="summary">
      <h2>📊 Summary</h2>
      <p>Total Steps: <span id="totalSteps">0</span></p>
      <p>Total Calories: <span id="totalCalories">0</span></p>
      <div class="progress">
        <div id="progressBar"></div>
      </div>
    </div>

    <h2>🗓️ Activity Log</h2>
    <ul id="activityList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
